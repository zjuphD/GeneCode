<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="1200" viewBox="0 0 1600 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="0" y2="1200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6FBFF" />
      <stop offset="1" stop-color="#FDF8F3" />
    </linearGradient>
    <filter id="blurLarge" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" />
    </filter>
    <filter id="blurSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="42" />
    </filter>

    <filter id="grainNoise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="2" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0 0.035" />
      </feComponentTransfer>
    </filter>

  </defs>

  <rect width="1600" height="1200" fill="url(#bgGradient)" />

  <ellipse cx="288" cy="264" rx="384" ry="216" fill="#B8E4FF" fill-opacity="0.62" filter="url(#blurLarge)" />
  <ellipse cx="1248" cy="240" rx="416" ry="240" fill="#D8F4FF" fill-opacity="0.56" filter="url(#blurLarge)" />
  <ellipse cx="1024" cy="864" rx="480" ry="288" fill="#FFDCC8" fill-opacity="0.44" filter="url(#blurLarge)" />
  <ellipse cx="512" cy="936" rx="352" ry="216" fill="#D7F8EE" fill-opacity="0.42" filter="url(#blurSoft)" />

  <rect width="1600" height="1200" fill="url(#bgGradient)" fill-opacity="0.18" />
  <rect width="1600" height="1200" fill="white" fill-opacity="0.1" />
  <rect width="1600" height="1200" filter="url(#grainNoise)" opacity="0.35" />
</svg>
