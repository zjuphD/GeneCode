<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" fill="none">
  <!-- 时钟外框 - 粗线条 -->
  <circle cx="22" cy="22" r="15" stroke="#22c55e" stroke-width="4" fill="none"/>

  <!-- 时针和分针 - 简单粗线 -->
  <line x1="22" y1="22" x2="22" y2="10" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
  <line x1="22" y1="22" x2="32" y2="22" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>

  <!-- 中心点 -->
  <circle cx="22" cy="22" r="3.5" fill="#22c55e"/>
</svg>