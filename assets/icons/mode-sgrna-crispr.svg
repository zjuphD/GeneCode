<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" fill="none">
  <!-- DNA双链 - 简化 -->
  <line x1="6" y1="22" x2="38" y2="22" stroke="#22c55e" stroke-width="4"/>
  <line x1="6" y1="28" x2="38" y2="28" stroke="#22c55e" stroke-width="4"/>

  <!-- 剪刀图标 - CRISPR -->
  <g transform="translate(18, 8)">
    <circle cx="4" cy="4" r="3" fill="#22c55e"/>
    <circle cx="12" cy="4" r="3" fill="#22c55e"/>
