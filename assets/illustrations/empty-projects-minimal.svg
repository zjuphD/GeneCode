<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none">
  <!-- 大圆圈背景 -->
  <circle cx="100" cy="80" r="50" stroke="#22c55e" stroke-width="3" stroke-dasharray="8 5" opacity="0.5"/>

  <!-- DNA 螺旋简化 -->
  <circle cx="100" cy="80" r="30" stroke="#22c55e" stroke-width="4" fill="none"/>
  <circle cx="100" cy="80" r="20" stroke="#f59e0b" stroke-width="3" fill="none"/>

  <!-- 加号表示新建 -->
  <line x1="100" y1="60" x2="100" y2="100" stroke="#22c55e" stroke-width="5" stroke-linecap="round"/>
  <line x1="80" y1="80" x2="120" y2="80" stroke="#22c55e" stroke-width="5" stroke-linecap="round"/>

  <!-- 底部提示条 -->
  <rect x="60" y="120" width="80" height="8" rx="4" fill="#22c55e" opacity="0.3"/>
  <rect x="70" y="135" width="60" height="6" rx="3" fill="#f59e0b" opacity="0.5"/>
</svg>