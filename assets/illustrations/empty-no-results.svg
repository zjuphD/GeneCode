<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" fill="none">
  <defs>
    <linearGradient id="noresult-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3f7f4"/>
      <stop offset="100%" stop-color="#e3e7e3"/>
    </linearGradient>
    <linearGradient id="noresult-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#85b692"/>
      <stop offset="100%" stop-color="#5e9a6f"/>
    </linearGradient>
  </defs>

  <!-- 背景装饰 -->
  <circle cx="120" cy="100" r="80" fill="url(#noresult-grad)" opacity="0.5"/>
  <circle cx="120" cy="100" r="60" fill="white" opacity="0.6"/>

  <!-- 放大镜（搜索中） -->
  <g transform="translate(120, 85)">
    <circle cx="-5" cy="-5" r="22" stroke="url(#noresult-accent)" stroke-width="2.5" fill="none" opacity="0.7"/>
    <line x1="12" y1="12" x2="22" y2="22" stroke="url(#noresult-accent)" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

    <!-- 搜索框内的 DNA 片段 -->
    <path d="M-15 -5 Q-10 -8, -5 -5 Q0 -2, 5 -5" stroke="#b3d1ba" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
    <path d="M-15 2 Q-10 -1, -5 2 Q0 5, 5 2" stroke="#b3d1ba" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
  </g>

  <!-- 问号标记 -->
  <g transform="translate(155, 55)">
    <circle cx="0" cy="0" r="14" fill="white" stroke="#dcdad5" stroke-width="1.5" opacity="0.9"/>
    <text x="0" y="5" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#878278" text-anchor="middle">?</text>
  </g>

  <!-- 空列表指示 -->
  <g transform="translate(120, 155)">
    <rect x="-30" y="0" width="60" height="4" rx="2" fill="#eae9e6" opacity="0.8"/>
    <rect x="-20" y="10" width="40" height="4" rx="2" fill="#eae9e6" opacity="0.6"/>
    <rect x="-10" y="20" width="20" height="4" rx="2" fill="#eae9e6" opacity="0.4"/>
  </g>

  <!-- 装饰小点 -->
  <circle cx="60" cy="70" r="3" fill="#d9a65a" opacity="0.3"/>
  <circle cx="180" cy="60" r="2" fill="#85b692" opacity="0.4"/>
  <circle cx="70" cy="140" r="2.5" fill="#b3d1ba" opacity="0.5"/>
</svg>